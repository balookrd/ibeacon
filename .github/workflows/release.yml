name: Release

# Builds signed release APKs and publishes them to GitHub Releases.
# Triggered automatically on git tags (e.g. v1.0.0) or manually via workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        type: string
        default: "v1.0.1"
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - id: vars
        name: Resolve release parameters
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="${tag#v}"
          # Compute incremental versionCode from build epoch minutes
          version_code=$(( $(date -u +%s) / 60 ))

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Release APK
        shell: bash
        env:
          BUILD_VERSION_NAME: ${{ steps.vars.outputs.version }}
          BUILD_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.IBEACON_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.IBEACON_KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS || secrets.IBEACON_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.IBEACON_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "Setting up keystore from repository secrets..."
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            export KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export KEY_ALIAS="$KEY_AL"
            export KEY_PASSWORD="$KEY_PASS"
            echo "Release signing: enabled"
          else
            echo "Release signing: disabled (no KEYSTORE_BASE64 secret provided) — APK will be unsigned"
          fi

          ./gradlew assembleRelease --console=plain

      - name: Package artifacts & generate checksums
        shell: bash
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          apk_src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apk_dest="dist/ibeacon-${TAG}.apk"
          cp "$apk_src" "$apk_dest"

          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "iBeacon ${{ steps.vars.outputs.tag }}"
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
