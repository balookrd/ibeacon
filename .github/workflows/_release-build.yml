name: Release Build

# Reusable build and publish workflow for iBeacon Android APKs.
# Assembles an optimized release APK (signed if keystore secrets are present),
# calculates SHA-256 checksums, and publishes to GitHub Releases.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      make_latest:
        required: false
        type: boolean
        default: true
      release_name:
        required: false
        type: string
        default: ""
      version_name:
        required: false
        type: string
        default: ""
      rolling_tag:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - id: vars
        name: Resolve build variables
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          checkout_ref="${{ inputs.checkout_ref }}"
          release_name="${{ inputs.release_name }}"
          version_name="${{ inputs.version_name }}"

          [[ -z "$checkout_ref" ]] && checkout_ref="$tag"
          [[ -z "$release_name" ]] && release_name="iBeacon $tag"
          if [[ -z "$version_name" ]]; then
            case "$tag" in
              v*) version_name="${tag#v}" ;;
              *)  version_name="$tag" ;;
            esac
          fi

          # versionCode in epoch minutes ensures newer builds (nightly or release) always win
          version_code=$(( $(date -u +%s) / 60 ))

          {
            echo "checkout_ref=$checkout_ref"
            echo "release_name=$release_name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble Release APK
        shell: bash
        env:
          BUILD_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          BUILD_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.IBEACON_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || secrets.IBEACON_KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS || secrets.IBEACON_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.IBEACON_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "Signing keys found in repository secrets"
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            export KEYSTORE_PASSWORD="$KEYSTORE_PASS"
            export KEY_ALIAS="$KEY_AL"
            export KEY_PASSWORD="$KEY_PASS"
            echo "Release signing: enabled"
          else
            echo "Release signing: disabled (no KEYSTORE_BASE64 secret) — APK will be unsigned"
          fi

          ./gradlew assembleRelease --console=plain

      - name: Stage APK artifact
        shell: bash
        env:
          VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          ROLLING: ${{ inputs.rolling_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist

          apk_src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [[ "$ROLLING" == "true" ]]; then
            name="ibeacon-nightly-${SHA:0:8}.apk"
          else
            name="ibeacon-${VERSION_NAME}.apk"
          fi

          cp "$apk_src" "dist/$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          retention-days: 1

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Move rolling tag
        if: ${{ inputs.rolling_tag }}
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          git tag -f "$TAG" "$REF"
          git push origin "refs/tags/$TAG" --force

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Clean up old rolling assets
        if: ${{ inputs.rolling_tag }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Rolling release does not exist yet; nothing to clean."
            exit 0
          fi
          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in "${assets[@]:-}"; do
            [[ -z "$asset" ]] && continue
            echo "Deleting old asset: $asset"
            gh release delete-asset "$TAG" "$asset" --yes
          done

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('iBeacon {0}', inputs.tag) }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
